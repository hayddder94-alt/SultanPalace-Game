[/Script/UnrealEd.EditorLoadingSavingSettings]
AutoSaveEnable=True
AutoSaveInEditor=True
AutoSaveInPIE=False
AutoSaveTimeMinutes=5

; --------------------------------------------------------------------------
; Do NOT import our runtime data as assets.
;
; Content/TBW/Data/*.json are plain UTF-8 files read at runtime with
; FFileHelper (see TBWDialogueSubsystem.cpp / TBWObjectiveSubsystem.cpp).
; They are deliberately NOT DataTable uassets: Arabic must never pass through
; the asset pipeline or the C++ compiler.
;
; With content monitoring on, the editor sees those .json files, decides they
; are "source content", and pops the DataTable import dialog. Importing would
; create a duplicate uasset that the runtime never reads and that would drift
; from the file that is actually shipped. So: monitoring off.
;
; If you ever DO want a DataTable, create it explicitly - never through this
; auto-import path.
bMonitorContentDirectories=False
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="TBW/Data/*",bInclude=False)))

[/Script/SourceControl.SourceControlSettings]
Provider=Git
