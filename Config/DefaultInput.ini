[/Script/Engine.InputSettings]
bUseMouseForTouch=False
bAlwaysShowTouchInterface=False
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
bEnableMouseSmoothing=True
bEnableFOVScaling=True
FOVScale=0.011110

; --------------------------------------------------------------------------
; Console access. The machine runs Windows in ar-IQ, and on a non-US keyboard
; layout the default Tilde binding is not always where the engine thinks it is.
; ConsoleKey is the key that opens the single-line console; ConsoleKeys is the
; full list. Backslash and F10 are layout-independent fallbacks. Note F10 also
; fires DebugManager.CycleToPreviousColumn on the way in - harmless, but that is
; why Backslash is listed first.
ConsoleKey=Tilde
+ConsoleKeys=Tilde
+ConsoleKeys=Backslash
+ConsoleKeys=F10

; All gameplay actions are Enhanced Input assets created in Phase 1:
;   IA_TBW_Move, IA_TBW_Look, IA_TBW_Sprint, IA_TBW_Crouch,
;   IA_TBW_Interact, IA_TBW_LightAttack, IA_TBW_HeavyAttack,
;   IA_TBW_Block, IA_TBW_Dodge, IA_TBW_Focus, IA_TBW_Toss,
;   IA_TBW_Holster, IA_TBW_Pause
; Mapping contexts: IMC_TBW_Default, _Dialogue, _Cinematic, _UI
