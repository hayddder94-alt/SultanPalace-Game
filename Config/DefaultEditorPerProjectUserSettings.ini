; ============================================================================
;  The Betrayed Will / وصية الغدر — project-wide editor defaults
;
;  WHY THIS FILE EXISTS
;
;  UEditorLoadingSavingSettings is declared UCLASS(config=EditorPerProjectUserSettings).
;  It is NOT read from DefaultEditor.ini. The same settings were written there
;  on 2026-08-19 and had no effect at all: the DataTable import dialog came
;  straight back on Content/TBW/Data/Dialogue/VS02_TheWillReading.json. Putting
;  a setting in a plausible-looking file is not the same as putting it in the
;  right one.
;
;  This file is the PROJECT default, committed for everyone. The per-user
;  override the editor writes lives in
;      Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini
;  and stays out of git. If the editor has already written that file, it wins
;  over this one - untick the box once in
;      Edit > Editor Preferences > Loading & Saving > Monitor Content Directories
;  and the two agree from then on.
; ============================================================================

[/Script/UnrealEd.EditorLoadingSavingSettings]
AutoSaveEnable=True
AutoSaveInEditor=True
AutoSaveInPIE=False
AutoSaveTimeMinutes=5

; Do NOT import our runtime data as assets.
;
; Content/TBW/Data/**/*.json are plain UTF-8 files read at runtime with
; FFileHelper - see TBWDialogueSubsystem.cpp:21 and TBWObjectiveSubsystem.cpp:25.
; They are deliberately NOT DataTable uassets: Arabic must never pass through
; the asset pipeline or the C++ compiler.
;
; With content monitoring on, the editor sees those .json files, decides they
; are "source content", and offers to import them. Accepting would create a
; UDataTable the runtime never reads, which would then drift away from the file
; that actually ships. There is no correct row type to pick in that dialog.
; The correct answer is Cancel, every time.
bMonitorContentDirectories=False

; Belt and braces: even with monitoring on, exclude the data directory.
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="TBW/Data/*",bInclude=False)))
